# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "glassdemo"

[setup]
script = '''
$ErrorActionPreference = "Stop"

function Add-ToPath([string]$PathItem) {
    if ([string]::IsNullOrWhiteSpace($PathItem)) {
        return
    }
    if (-not (Test-Path $PathItem)) {
        return
    }
    $segments = $env:PATH -split ';'
    if ($segments -notcontains $PathItem) {
        $env:PATH = "$PathItem;$env:PATH"
    }
}

$defaultJdks = @(
    $env:JAVA_HOME,
    "C:\\Users\\wuchaoli\\AppData\\Local\\Android\\jdk\\jdk-17.0.18+8",
    "C:\\Program Files\\Android\\Android Studio\\jbr"
) | Where-Object { $_ -and (Test-Path $_) }

if (-not $defaultJdks) {
    throw "JAVA_HOME is not configured and no local JDK 17 installation was found."
}

$env:JAVA_HOME = $defaultJdks[0]
Add-ToPath (Join-Path $env:JAVA_HOME "bin")

$defaultSdkRoots = @(
    $env:ANDROID_SDK_ROOT,
    $env:ANDROID_HOME,
    "C:\\Users\\wuchaoli\\AppData\\Local\\Android\\Sdk"
) | Where-Object { $_ -and (Test-Path $_) }

if (-not $defaultSdkRoots) {
    throw "ANDROID_SDK_ROOT is not configured and no local Android SDK was found."
}

$env:ANDROID_SDK_ROOT = $defaultSdkRoots[0]
$env:ANDROID_HOME = $env:ANDROID_SDK_ROOT

$requiredNdkVersion = "29.0.14206865"
$requiredBuildTools = "34.0.0"
$preferredCmakeVersion = "3.22.1"

$env:ANDROID_NDK_HOME = Join-Path (Join-Path $env:ANDROID_SDK_ROOT "ndk") $requiredNdkVersion
$env:ANDROID_NDK_ROOT = $env:ANDROID_NDK_HOME

Add-ToPath (Join-Path $env:ANDROID_SDK_ROOT "platform-tools")
Add-ToPath (Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools\\latest\\bin")
Add-ToPath (Join-Path $env:ANDROID_SDK_ROOT "build-tools\\$requiredBuildTools")
Add-ToPath (Join-Path $env:ANDROID_SDK_ROOT "cmake\\$preferredCmakeVersion\\bin")

$sdkManager = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools\\latest\\bin\\sdkmanager.bat"
if (-not (Test-Path $sdkManager)) {
    throw "sdkmanager.bat was not found under $env:ANDROID_SDK_ROOT\\cmdline-tools\\latest\\bin."
}

$requiredPackages = @(
    @{
        package = "platform-tools"
        checkPath = Join-Path $env:ANDROID_SDK_ROOT "platform-tools\\adb.exe"
    },
    @{
        package = "platforms;android-34"
        checkPath = Join-Path $env:ANDROID_SDK_ROOT "platforms\\android-34"
    },
    @{
        package = "build-tools;$requiredBuildTools"
        checkPath = Join-Path $env:ANDROID_SDK_ROOT "build-tools\\$requiredBuildTools"
    },
    @{
        package = "ndk;$requiredNdkVersion"
        checkPath = $env:ANDROID_NDK_HOME
    },
    @{
        package = "cmake;$preferredCmakeVersion"
        checkPath = Join-Path $env:ANDROID_SDK_ROOT "cmake\\$preferredCmakeVersion"
    }
)

foreach ($entry in $requiredPackages) {
    if (-not (Test-Path $entry.checkPath)) {
        & $sdkManager --install $entry.package | Out-Host
    }
}

Write-Output "y" | & $sdkManager --licenses | Out-Null

Write-Host "JAVA_HOME=$env:JAVA_HOME"
Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"
Write-Host "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME"

& .\\gradlew.bat --version
& .\\gradlew.bat help
'''

[[actions]]
name = "Gradle Help"
icon = "run"
command = ".\\gradlew.bat help"

[[actions]]
name = "ADB Devices"
icon = "run"
command = "adb devices"

[[actions]]
name = "Deploy And Tail Logs"
icon = "run"
command = '''
$ErrorActionPreference = 'Stop'
$logDir = Join-Path $PWD '.reports\logcat'
New-Item -ItemType Directory -Force -Path $logDir | Out-Null
$timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
$logFile = Join-Path $logDir ('standard_debug_' + $timestamp + '.log')
$patterns = @(
    'HiddenRisk',
    'AiInspection',
    'InspectionLoadingActivity',
    'DeviceGuideActivity',
    'HazardRecordActivity',
    'OnlineHazardDetectionService',
    'AiArSseService',
    'LocalHazardPushApi',
    'AutoHazard',
    'sessionMemory',
    'AndroidRuntime',
    'ActivityTaskManager'
)
adb wait-for-device
adb logcat -c
.\gradlew.bat assembleStandardDebug
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
.\gradlew.bat installStandardDebug
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
adb shell am start -n com.rokid.glesse/com.rokid.glass.hiddenrisk.InspectionLoadingActivity
Start-Sleep -Seconds 2
Write-Host ('Streaming filtered logcat to ' + $logFile)
adb logcat -v time | Select-String -Pattern $patterns | Tee-Object -FilePath $logFile
'''
