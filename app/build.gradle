android {
    namespace 'com.rokid.glesse'
    compileSdk 34
    ndkVersion "29.0.14206865"
    flavorDimensions += "edition"

    defaultConfig {
        applicationId "com.rokid.glesse"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    productFlavors {
        standard {
            dimension "edition"
            buildConfigField "long", "AI_INSPECTION_ONLINE_DETECT_INTERVAL_MS", "1000L"
            buildConfigField "boolean", "AI_INSPECTION_FORCE_ONLINE_DETAIL_FOR_LOCAL_HAZARD", "false"
            buildConfigField "boolean", "AI_INSPECTION_DEMO_ONLINEONLY", "false"
        }
        demoOnlineonly {
            dimension "edition"
            applicationIdSuffix ".demoonlineonly"
            versionNameSuffix "-demo-onlineonly"
            buildConfigField "long", "AI_INSPECTION_ONLINE_DETECT_INTERVAL_MS", "2000L"
            buildConfigField "boolean", "AI_INSPECTION_FORCE_ONLINE_DETAIL_FOR_LOCAL_HAZARD", "true"
            buildConfigField "boolean", "AI_INSPECTION_DEMO_ONLINEONLY", "true"
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    viewBinding {
        enable = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    packagingOptions {
        // 确保只保留第一个遇到的so文件
        pickFirst 'lib/arm64-v8a/libr2aud.so'
        pickFirst 'lib/armeabi-v7a/libr2aud.so'
    }

}

