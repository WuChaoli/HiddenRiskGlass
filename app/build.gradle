tasks.register("assembleDefaultDebug") {
    group = "build"
    description = "Assembles the default standard debug variant."
    dependsOn("assembleStandardDebug")
}

tasks.register("assembleDefaultRelease") {
    group = "build"
    description = "Assembles the default standard release variant."
    dependsOn("assembleStandardRelease")
}

tasks.register("installDefaultDebug") {
    group = "install"
    description = "Installs the default standard debug variant."
    dependsOn("installStandardDebug")
}
