plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.rokid.glesse'
    compileSdk 34
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.rokid.glesse"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    viewBinding {
        enable = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    packagingOptions {
        // 确保只保留第一个遇到的so文件
        pickFirst 'lib/arm64-v8a/libr2aud.so'
        pickFirst 'lib/armeabi-v7a/libr2aud.so'
    }

}

// 编译前检查原生依赖是否存在
task checkNativeDependencies {
    def ncnnDir = file("src/main/jni/ncnn-20260113-android-vulkan")
    def opencvDir = file("src/main/jni/opencv-mobile-4.13.0-android")

    doLast {
        if (!ncnnDir.exists()) {
            throw new GradleException(
                "\n❌ 缺少 ncnn 原生依赖！\n" +
                "请运行依赖安装脚本：\n" +
                "  Windows: .\\scripts\\setup_dependencies.ps1\n" +
                "  macOS/Linux: ./scripts/setup_dependencies.sh\n" +
                "详见 SETUP.md 或 README.md\n"
            )
        }
        if (!opencvDir.exists()) {
            throw new GradleException(
                "\n❌ 缺少 OpenCV 原生依赖！\n" +
                "请运行依赖安装脚本：\n" +
                "  Windows: .\\scripts\\setup_dependencies.ps1\n" +
                "  macOS/Linux: ./scripts/setup_dependencies.sh\n" +
                "详见 SETUP.md 或 README.md\n"
            )
        }
    }
}

preBuild.dependsOn checkNativeDependencies

dependencies {
    // Rokid Glass SDK
    implementation(libs.rokid.glass.sdk) {
        exclude group: "org.slf4j"
    }

    // 识别相关
    implementation libs.mlkit.barcode.scanning
    implementation libs.play.services.mlkit.barcode.scanning

    // 网络
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson

    // 工具
    implementation libs.utilcodex
    implementation libs.gson
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    implementation libs.easypermissions

    // UI
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.datastore.core.android

    // Firebase
    implementation libs.firebase.firestore.ktx

    // 测试
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
